name: Compile and benchmark
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install verified Zig 0.17.0
        run: python3 tools/install_zig.py "$RUNNER_TEMP/zig"
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.97.1
      - name: Verify proc-macro final linker inputs
        run: |
          zig build -Doptimize=ReleaseFast
          python3 tests/link_observer.py zig-out/bin/nanocompile
          python3 tests/native_identity.py zig-out/bin/nanocompile --output bench-results/native-identity.json
          python3 tests/producer_cache.py zig-out/bin/nanocompile --output bench-results/producer-cache.json
          python3 tests/producer_cache.py zig-out/bin/nanocompile --cargo-flags --output bench-results/producer-cache-cargo-flags.json
          python3 tests/static_native_cache.py zig-out/bin/nanocompile --output bench-results/static-native-cache.json
          python3 tests/rmeta_priority_probe.py zig-out/bin/nanocompile --output bench-results/rmeta-priority-probe.json
          python3 tests/native_metadata_probe.py --output bench-results/native-metadata-probe.json
          python3 tests/native_metadata_cache.py zig-out/bin/nanocompile --output bench-results/native-metadata-cache.json
          python3 tests/executable_cache.py zig-out/bin/nanocompile --output bench-results/executable-cache.json
          zig build-exe -O ReleaseFast -lc --dep link_dependencies -Mroot=tools/link_report.zig -Mlink_dependencies=src/link_dependencies.zig -femit-bin="$RUNNER_TEMP/link-report"
          python3 tests/producer_link_probe.py --state "$RUNNER_TEMP/producer, link probe" --output bench-results/producer-link-probe.json --decoder "$RUNNER_TEMP/link-report" --observer zig-out/bin/nanocompile
          python3 tests/producer_placement.py --output bench-results/producer-placement.json --observer zig-out/bin/nanocompile
      - name: Build and real compiler tests
        run: |
          python3 tests/build_trace_capture.py
          python3 tests/r2_transport.py
          zig build -Doptimize=ReleaseFast
          zig build test
          zig build-exe -OReleaseFast -lc --dep compiler_stream -Mroot=tools/compiler_stream_probe.zig -Mcompiler_stream=src/compiler_stream.zig -femit-bin="$RUNNER_TEMP/compiler-stream-probe"
          python3 tests/compiler_stream.py "$RUNNER_TEMP/compiler-stream-probe"
          NANOCOMPILE_STREAM_COMPILER=1 python3 tests/integration.py zig-out/bin/nanocompile
          python3 tests/build_script_cache.py zig-out/bin/nanocompile --output bench-results/build-script-cache.json
          python3 benchmarks/experiments/rust_physical_memo_check.py zig-out/bin/nanocompile --output bench-results/rust-physical-memo.json
          python3 tests/zig_preserved_mtime.py zig-out/bin/nanocompile --output bench-results/zig-preserved-mtime.json
          python3 benchmarks/experiments/selected_decoder_scope_check.py zig-out/bin/nanocompile --other-toolchain 1.98.1 --output bench-results/decoder-scope.json
          python3 tests/clang_cache.py zig-out/bin/nanocompile --output bench-results/clang-cache.json
          zig build integration -Doptimize=ReleaseFast
      - name: Verify direct Rust metadata against rustc
        run: |
          zig build-exe -OReleaseFast -lc src/rmeta_direct.zig -femit-bin="$RUNNER_TEMP/rmeta-direct"
          python3 benchmarks/experiments/rmeta_direct_fixture_check.py "$RUNNER_TEMP/rmeta-direct" --output bench-results/rmeta-direct.json
      - name: Verify portable C/C++ cache and linked outputs
        run: |
          python3 tests/portable_cc.py zig-out/bin/nanocompile --output bench-results/portable-cc.json
          python3 tests/portable_cc_benchmark.py zig-out/bin/nanocompile --runs 5 --output bench-results/portable-cpp-benchmark.json
      - name: Verify live native selector overlap
        if: runner.os == 'macOS'
        run: python3 tests/clang_selection.py zig-out/bin/nanocompile --output bench-results/clang-selection.json
      - name: Verify real Turborepo task cache
        run: |
          python3 tests/turbo_server.py
          npm ci --prefix examples/turborepo --ignore-scripts --no-audit --no-fund
          python3 tests/turbo_integration.py zig-out/bin/nanocompile --output bench-results/turborepo.json
          python3 tests/task_comparison.py zig-out/bin/nanocompile --runs 9 --output bench-results/declared-tasks.json
      - name: Benchmark complete compiler invocations
        run: python3 tests/benchmark.py zig-out/bin/nanocompile --runs 9 --output bench-results/runner.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: benchmark-${{ matrix.os }}
          path: bench-results/
